[project]
name = "erq-marketplace"
version = "1.0.0"
description = "Erq - Ethiopian Freelance Marketplace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "passlib>=1.7.4",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
]

[tool.vercel]
entrypoint = "api/index.py"
