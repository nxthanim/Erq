# ===================================================
#  Erq Marketplace — Nginx Reverse Proxy Config
#  For DuckDNS domain with Let's Encrypt SSL
# ===================================================
#
#  Usage:
#    1. Replace YOUR_DOMAIN with your DuckDNS domain (e.g., myapp.duckdns.org)
#    2. Copy to /etc/nginx/sites-available/erq
#    3. sudo ln -s /etc/nginx/sites-available/erq /etc/nginx/sites-enabled/
#    4. sudo nginx -t
#    5. sudo systemctl restart nginx
#
#  For SSL with Let's Encrypt:
#    sudo apt install certbot python3-certbot-nginx
#    sudo certbot --nginx -d YOUR_DOMAIN.duckdns.org
#
# ===================================================

server {
    listen 80;
    server_name YOUR_DOMAIN.duckdns.org *.YOUR_DOMAIN.duckdns.org;

    # --- Let's Encrypt ACME challenge (for SSL cert) ---
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # --- Redirect all HTTP to HTTPS ---
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN.duckdns.org *.YOUR_DOMAIN.duckdns.org;

    # --- SSL Certificates (created by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN.duckdns.org/privkey.pem;

    # --- Strong SSL settings ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- HSTS (uncomment after verifying SSL works) ---
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Proxy all requests to the Node.js backend ---
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeout for AI agent responses
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Increase upload size for file uploads ---
    client_max_body_size 20M;
}
